<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>Sign In to Your Account</h3>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="name@example.com" required>
            </div>
            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" style="margin-top: 1.25rem; width: 100%;">Sign In</button>
        </form>
        <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem;">
            Don't have an account? <a href="#" onclick="switchModal('loginModal', 'registerModal')" style="color: var(--primary); font-weight: 700;">Register</a>
        </p>
    </div>
</div>

<!-- Register Modal -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <h3>Create an Account</h3>
        <form id="registerForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label for="regFirstName">First Name</label>
                    <input type="text" id="regFirstName" required>
                </div>
                <div class="form-group">
                    <label for="regLastName">Last Name</label>
                    <input type="text" id="regLastName" required>
                </div>
            </div>
            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="regContact">Contact Number</label>
                <input type="tel" id="regContact" placeholder="09123456789" required>
            </div>
            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="name@example.com" required>
            </div>
            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn-secondary" style="margin-top: 1.25rem; width: 100%;">Create Account</button>
        </form>
        <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem;">
            Already registered? <a href="#" onclick="switchModal('registerModal', 'loginModal')" style="color: var(--primary); font-weight: 700;">Sign In</a>
        </p>
    </div>
</div>
